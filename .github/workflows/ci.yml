name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Generate fixtures
        run: python3 gen_fixtures.py
      - name: Run tests
        run: node test.mjs
